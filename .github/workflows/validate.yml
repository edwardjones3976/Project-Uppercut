name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phase0-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling dependencies  # [ Claude (Cowork) | Claude Fable 5 (claude-fable-5) | 2026-08-02 22:16 UTC | edit ]
        run: pip install -r requirements-dev.txt
      - name: Canonical data, schema and Rule 10 test suite
        run: python3 -m pytest -q
      - name: Rule validators (fighters, score isolation, data laws, budget)
        run: python3 -m tools.uppercut_validate.cli all
      # [ Claude (Cowork) | Claude Opus 5 (claude-opus-5) | 2026-08-08 08:15 UTC | START edit ]
      # The 2026-08-07 state review: "STATUS.md freshness is not enforced by
      # CI". Half true - test_status_is_current runs in the suite above, but it
      # allows 5% drift and must, because it lives inside the suite gen_status
      # runs. CI has no such self-reference, so here it is exact. A generated
      # file allowed to be stale is hand-maintained drift with extra machinery.
      - name: STATUS.md is regenerated, not drifting
        run: python3 -m tools.gen_status --check
      # [ Claude (Cowork) | Claude Opus 5 (claude-opus-5) | 2026-08-08 08:15 UTC | END edit ]
# [ Claude (Cowork) | Claude Opus 5 (claude-opus-5) | 2026-08-02 19:34 UTC | END ]
