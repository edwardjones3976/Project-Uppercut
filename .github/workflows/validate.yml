# [ Claude (Cowork) | Claude Opus 5 (claude-opus-5) | 2026-08-02 19:34 UTC | START ]
name: validate

on:
  push:
    branches: [main]
  pull_request:

# [ Claude (Cowork) | Claude Opus 5 (claude-opus-5) | 2026-08-09 21:32 UTC | START edit: audit medium finding ]
# Default token permissions are whatever the repository setting says, which for
# most repositories is read-write on everything. Nothing in this workflow writes
# to the repository, so it gets read-only and says so. Least privilege at the
# workflow level applies to every job below unless a job overrides it.
permissions:
  contents: read
# [ ... | 2026-08-09 21:32 UTC | END edit ]

jobs:
  phase0-validation:
    runs-on: ubuntu-latest
    steps:
      # [ Claude (Cowork) | Claude Opus 5 (claude-opus-5) | 2026-08-09 21:32 UTC | START edit: pin actions, drop the credential ]
      # `@v4` is a MUTABLE tag: whoever controls that repository can move it,
      # and every run after that executes different code with our token. In a
      # project whose entire trust model is "the same inputs produce the same
      # bytes", that is the one dependency nobody was pinning. SHAs resolved
      # from the upstream repositories on 2026-08-09 and recorded beside each.
      #
      # persist-credentials: false because the default leaves the GITHUB_TOKEN
      # in .git/config for every later step to read. No step here pushes.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      # [ ... | 2026-08-09 21:32 UTC | END edit ]
      - name: Install tooling dependencies  # [ Claude (Cowork) | Claude Fable 5 (claude-fable-5) | 2026-08-02 22:16 UTC | edit ]
        run: pip install -r requirements-dev.txt
      - name: Canonical data, schema and Rule 10 test suite
        run: python3 -m pytest -q
      - name: Rule validators (fighters, score isolation, data laws, budget)
        run: python3 -m tools.uppercut_validate.cli all
      # [ Claude (Cowork) | Claude Opus 5 (claude-opus-5) | 2026-08-08 08:15 UTC | START edit ]
      # The 2026-08-07 state review: "STATUS.md freshness is not enforced by
      # CI". Half true - test_status_is_current runs in the suite above, but it
      # allows 5% drift and must, because it lives inside the suite gen_status
      # runs. CI has no such self-reference, so here it is exact. A generated
      # file allowed to be stale is hand-maintained drift with extra machinery.
      - name: STATUS.md is regenerated, not drifting
        run: python3 -m tools.gen_status --check
      # [ ... | 2026-08-08 08:15 UTC | END edit ]
      # [ Claude (Cowork) | Claude Opus 5 (claude-opus-5) | 2026-08-09 21:32 UTC | START edit: the index cannot rot again ]
      # An external audit found the README indexing decisions through 0012
      # while main carried 0032. Same disease as STATUS.md, same cure. This
      # step also fails on a DUPLICATE or NON-CONTIGUOUS decision number, which
      # is how two collisions reached a merge by hand on 2026-08-09.
      - name: Decision index is regenerated, contiguous and unique
        run: python3 -m tools.gen_decision_index --check
      # [ ... | 2026-08-09 21:32 UTC | END edit ]

  # [ Claude (Cowork) | Claude Opus 5 (claude-opus-5) | 2026-08-09 21:35 UTC | START edit: issue #14, the Windows lane ]
  # WHY THIS EXISTS. Issue #14 and every audit of this repository have said the
  # same thing: the authoritative simulation is developed on Windows against
  # UE 5.8, and CI only ever proved it on Ubuntu. Two whole classes of defect
  # were invisible - path separators and case sensitivity in the canon readers,
  # and anything about how the C++ core builds.
  #
  # WHAT THIS LANE HONESTLY IS. It proves the Python authority and the C++
  # SOURCE on Windows. It does NOT run Unreal: a GitHub-hosted runner has no
  # UE 5.8 install, and pretending otherwise would put a green check next to a
  # claim nobody verified - which is the exact failure Rule 18 exists to stop.
  # The engine proofs (prove_core_range / prove_core_evade / prove_live_arena)
  # remain operator-run on the Windows box with UE installed, and the runbook
  # in docs/SEE_AND_TEST.md is where they live. When a self-hosted runner with
  # UE 5.8 exists, it goes here and this comment changes.
  windows-authority:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install tooling dependencies
        run: pip install -r requirements-dev.txt
      - name: Full suite on Windows paths
        run: python -m pytest -q
      - name: Rule validators on Windows paths
        run: python -m tools.uppercut_validate.cli all
      # [ Claude (Cowork) | Claude Opus 5 (claude-opus-5) | 2026-08-09 22:14 UTC | START edit: Rule 18 step name ]
      # "Compiles as C++" was a claim no runner verifies: there is no UE 5.8
      # on a GitHub-hosted runner and nothing in this job invokes a compiler.
      # The step now says what the script actually proves: UTF-8 cleanliness,
      # quoted-include resolution against the module tree, commandlets really
      # subclassing UCommandlet, UHT generated.h placement, brace balance (the
      # file-sync truncation tripwire), and Build.cs invariants. What it does
      # NOT claim: compilation, linking, or engine behavior - those proofs
      # are operator-run per docs/SEE_AND_TEST.md.
      - name: C++ core source integrity (not a compile - no UE on runner)
        run: python -m tools.engine.check_core_compiles
      # [ Claude (Cowork) | Claude Opus 5 (claude-opus-5) | 2026-08-09 22:14 UTC | END edit: Rule 18 step name ]
  # [ ... | 2026-08-09 21:35 UTC | END edit ]
# [ Claude (Cowork) | Claude Opus 5 (claude-opus-5) | 2026-08-02 19:34 UTC | END ]
